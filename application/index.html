<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
        <title>Goman</title>
        <meta name="description" content="Trade on what happens next. A modern, bilingual prediction market."/>
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9F8"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0F0D"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <script>
            // Pre-paint: stamp the saved theme and language before the first frame, so a
            // returning dark/fa visitor never sees a light/LTR flash. Keys mirror the stores.
            (function ()
            {
                var theme = localStorage.getItem('goman.theme') ?? localStorage.getItem('auctionhouse.theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
                var lang = (localStorage.getItem('goman.lang') ?? localStorage.getItem('auctionhouse.lang')) === 'fa' ? 'fa' : 'en';
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            })();
        </script>
        <link rel="stylesheet" href="/src/styles.css"/>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
