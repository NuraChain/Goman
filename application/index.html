<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Goman</title>
        <meta name="description" content="Trade on what happens next. A modern, bilingual prediction market." />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9F8" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0F0D" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Goman" />
        <!-- The installed app draws its own chrome, so the status bar sits over the header's
             own translucent surface rather than over an opaque bar in the wrong colour. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <script>
            // Pre-paint: stamp the theme and language before the first frame, so a dark or RTL
            // visitor never sees a light/LTR flash. Keys mirror the stores.
            //
            // This MUST reach the same answer as `preferredLang` in src/i18n/langs.ts, or the
            // first frame is thrown away by the store's own stamp - so the language table is
            // INJECTED here from langs.ts by the `lang-dirs` plugin in vite.config.ts rather
            // than written out a second time. Left un-injected it degrades to English, never
            // to a crash. The matching rule is the primary subtag, exactly as over there.
            (function () {
                var theme = localStorage.getItem('goman.theme') ?? localStorage.getItem('auctionhouse.theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';

                var dirs = '__LANG_DIRS__';
                var saved = localStorage.getItem('goman.lang') ?? localStorage.getItem('auctionhouse.lang');
                // A saved code is a CHOICE; only its absence falls through to the browser's.
                var wanted = saved ? [saved] : navigator.languages || [navigator.language || 'en'];

                var lang = 'en';
                for (var i = 0; i < wanted.length; i++) {
                    var primary = String(wanted[i]).toLowerCase().split('-')[0];
                    if (dirs[primary]) {
                        lang = primary;
                        break;
                    }
                }

                document.documentElement.lang = lang;
                document.documentElement.dir = dirs[lang] === 'rtl' ? 'rtl' : 'ltr';
            })();
        </script>
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx" defer></script>
    </body>
</html>
