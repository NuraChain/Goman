<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Goman</title>
        <meta name="description" content="Trade on what happens next. A modern, bilingual prediction market." />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9F8" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0F0D" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Goman" />
        <!-- The installed app draws its own chrome, so the status bar sits over the header's
             own translucent surface rather than over an opaque bar in the wrong colour. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <script>
            // Pre-paint: stamp the saved theme and language before the first frame, so a
            // returning dark/fa visitor never sees a light/LTR flash. Keys mirror the stores.
            (function () {
                var theme = localStorage.getItem('goman.theme') ?? localStorage.getItem('auctionhouse.theme');
                document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
                var lang =
                    (localStorage.getItem('goman.lang') ?? localStorage.getItem('auctionhouse.lang')) === 'fa'
                        ? 'fa'
                        : 'en';
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            })();
        </script>
        <link rel="stylesheet" href="/src/styles.css" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx" defer></script>
    </body>
</html>
