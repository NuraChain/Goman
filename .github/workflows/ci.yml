# The same gates you run locally, on every push: check, build, test.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The server suite runs against a real PostgreSQL, as it does locally: a schema per store, in a
    # database it may create schemas in. Trust auth, because nothing but this job can reach it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: goman_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        # Over TCP: while the image initialises, its temporary server listens on the socket only,
        # and a socket check would call it healthy before the suite can reach it.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d goman_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/goman_test
      # The build requires every VITE_* key (none has a default) - the live chain's, as in .env.example.
      VITE_RPC_URL: https://rpc.nurachain.net
      VITE_CHAIN_ID: '1020'
      VITE_CHAIN_NAME: Nurachain
      VITE_CURRENCY_SYMBOL: NURA
      VITE_CURRENCY_DECIMALS: '18'
      VITE_EXPLORER_URL: https://explorer.nurachain.net
      VITE_ADMIN_ADDRESS: '0x2Ef2D5A095Fd5Ecd686d99eD3cd1F9ff91fc3167'
      VITE_SITE_URL: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
